name: Build Windows preview

on:
  push:
    branches: [feat/edge-tasks-v1]
    tags: ['v*-tasks.*']

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Duye0120/Edge-Drop'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package Windows x64 installer and ZIP
        run: npm run build:github
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged runtime, profile isolation, architecture and hashes
        run: node scripts/verify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Duye0120/Edge-Drop'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview-${{ github.sha }}
          path: release-assets
      - name: Publish verified test prerelease and verify public downloads
        run: node scripts/publish-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
